<div class="min-h-screen bg-white dark:bg-slate-950">
  <div class="mx-auto max-w-[880px] px-6 pt-24 pb-12 max-[820px]:pt-14">
    <header class="flex items-start justify-between gap-4">
      <div>
        <h1 class="m-0 text-[34px] leading-[1.2] font-extrabold tracking-[-0.02em] text-slate-900 dark:text-slate-100">
          Discover new music
        </h1>
        <p class="mt-3 text-[15px] leading-6 text-slate-500 dark:text-slate-400">
          Pick your favourite genre to start.
        </p>
      </div>
    </header>

    <section
      aria-label="Genres"
      class="mt-11 grid grid-cols-4 gap-7 max-[820px]:grid-cols-2 max-[820px]:gap-4.5"
    >
      <a class="relative aspect-square rounded-md card--random">
        <span class="absolute left-[18px] bottom-[18px] text-2xl font-extrabold tracking-[-0.01em] text-black/85 dark:text-black/90">
          Random
        </span>
      </a>

      <a class="relative aspect-square rounded-md card--pop">
        <span class="absolute left-[18px] bottom-[18px] text-2xl font-extrabold tracking-[-0.01em] text-black/85 dark:text-black/90">
          Pop
        </span>
      </a>

      <a class="relative aspect-square rounded-md card--rock">
        <span class="absolute left-[18px] bottom-[18px] text-2xl font-extrabold tracking-[-0.01em] text-black/85 dark:text-black/90">
          Rock
        </span>
      </a>

      <a class="relative aspect-square rounded-md card--indie">
        <span class="absolute left-[18px] bottom-[18px] text-2xl font-extrabold tracking-[-0.01em] text-black/85 dark:text-black/90">
          Indie
        </span>
      </a>

      <a
        routerLink="/random"
        class="relative aspect-square rounded-md border border-slate-200 bg-slate-50 transition-transform duration-150 hover:scale-[1.02] hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-slate-300 focus:ring-offset-2 dark:border-slate-700 dark:bg-slate-900 dark:hover:bg-slate-800 dark:focus:ring-slate-700 dark:focus:ring-offset-slate-950"
      >
        <span class="absolute left-[18px] bottom-[18px] text-2xl font-extrabold tracking-[-0.01em] text-slate-900 dark:text-slate-100">
          Header
        </span>
      </a>
    </section>
  </div>
</div>
