<div class="min-h-screen bg-white dark:bg-slate-950">
  <div class="mx-auto max-w-[880px] px-6 pt-24 pb-12 max-[820px]:pt-14">
    <header class="flex items-start justify-between gap-4">
      <div>
        <h1 class="m-0 text-[34px] leading-[1.2] font-extrabold tracking-[-0.02em] text-slate-900 dark:text-slate-100">
          Discover new music
        </h1>
        <p class="mt-3 text-[15px] leading-6 text-slate-500 dark:text-slate-400">
          Pick your favourite genre to start.
        </p>
      </div>
    </header>

    <section
      aria-label="Genres"
      class="mt-11 grid grid-cols-4 gap-7 max-[820px]:grid-cols-2 max-[820px]:gap-4.5"
    >
      @for (genre of genres; track genre.id; let index = $index) {
        <a
          [routerLink]="['/', genre.routeSegment]"
          class="genre-card relative aspect-square rounded-md"
          [class]="getGenreCardClass(index)"
        >
          <span class="genre-card-label absolute left-[18px] right-[18px] bottom-[18px] font-extrabold tracking-[-0.01em] text-black/85 dark:text-black/90">
            {{ getGenreDisplayName(genre.name) }}
          </span>
        </a>
      }
    </section>
  </div>
</div>
